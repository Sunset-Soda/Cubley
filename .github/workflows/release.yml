name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml', 'RELEASE_NOTES.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cmd: npx electron-builder --linux AppImage --publish never
          - os: windows-latest
            cmd: npx electron-builder --win nsis --publish never
          - os: macos-latest
            cmd: npx electron-builder --mac dmg --arm64 --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run fonts
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run fonts
      - name: Prepare web assets
        run: |
          mkdir www
          cp index.html www/index.html
          cp -r fonts www/fonts
      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          if 'resizeableActivity' not in s:
              s=s.replace('<activity','<activity\n            android:resizeableActivity="true"',1)
          open(p,'w').write(s)
          PY
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Align and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist
          $BT/zipalign -p -f 4 "$UNSIGNED" dist/aligned.apk
          $BT/apksigner sign --ks android-signing/cubely.keystore --ks-key-alias cubely --ks-pass pass:cubelyapp --key-pass pass:cubelyapp --out dist/Cubely-1.1.0.apk dist/aligned.apk
          rm dist/aligned.apk
          $BT/apksigner verify dist/Cubely-1.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: Cubely ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          body_path: RELEASE_NOTES.md
          files: out/*
